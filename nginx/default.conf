# Rate limits per visitor IP for forms bots like (sign in, sign up, password reset, contact).
# If a CDN/proxy (e.g. Cloudflare) sits in front of nginx, add its ranges with set_real_ip_from
# and `real_ip_header CF-Connecting-IP;` so $remote_addr is the visitor, not the proxy.
limit_req_zone $binary_remote_addr zone=auth_forms:10m rate=10r/m;
limit_req_status 429;

server {
    listen       80;
    server_name  localhost;
    client_max_body_size 100M;

    # Sign in / sign up / password reset / contact: 10 a minute per IP, bursts of 10
    location ~ ^/api/(auth/login|auth/password/request|auth/password/reset|v1/register|v1/support)$ {
        limit_req zone=auth_forms burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://map-listening-api:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        error_page 502 503 504 = @api_down;
    }

    location /api/ {
        proxy_pass http://map-listening-api:8055/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        # Directus chưa lên: trả 502 dạng JSON thay vì trang lỗi HTML
        error_page 502 503 504 = @api_down;
    }

    location /admin/ {
        proxy_pass http://map-listening-api:8055/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        error_page 502 503 504 = @api_down;
    }

    # Thư mục web không có 50x.html, nên trước đây lỗi 502 bị biến thành 404
    # và trông như "sai đường dẫn". Giờ báo thẳng là API không chạy.
    location @api_down {
        default_type application/json;
        return 502 '{"errors":[{"message":"API (Directus) is not running","extensions":{"code":"API_UNAVAILABLE"}}]}';
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
