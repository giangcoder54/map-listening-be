server {
    listen       80;
    server_name  localhost;
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://map-listening-api:8055/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        # Directus chưa lên: trả 502 dạng JSON thay vì trang lỗi HTML
        error_page 502 503 504 = @api_down;
    }

    location /admin/ {
        proxy_pass http://map-listening-api:8055/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        error_page 502 503 504 = @api_down;
    }

    # Thư mục web không có 50x.html, nên trước đây lỗi 502 bị biến thành 404
    # và trông như "sai đường dẫn". Giờ báo thẳng là API không chạy.
    location @api_down {
        default_type application/json;
        return 502 '{"errors":[{"message":"API (Directus) is not running","extensions":{"code":"API_UNAVAILABLE"}}]}';
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
